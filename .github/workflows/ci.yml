name: Retail Analytics CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall src dashboard

      - name: Secret hygiene check
        run: |
          ! grep -R "github_pat_" .
          ! grep -R "AKIA[0-9A-Z]" .

  codespace:
    # Builds .devcontainer (what GitHub Codespaces runs) and runs the doctor and the
    # whole pipeline inside it, so "Open in Codespaces" is known to work.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the dev container and run the pipeline in it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            python scripts/doctor.py || true
            bash scripts/run_all.sh
            ls -la outputs/sql_results outputs/figures


  laptop-windows:
    # The laptop path exactly as the Lab's Windows lessons give it: PowerShell, Python 3.13 (the version
    # the lessons install), a venv, the doctor, the whole pipeline, then the dashboard renders.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The lessons' commands, in one PowerShell session
        env:
          PNP_DOCTOR_CI: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python --version
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          git config --global user.name "Lab CI"
          git config --global user.email "lab-ci@users.noreply.github.com"
          python scripts/doctor.py
          python src/download_data.py
          python src/prepare_data.py
          python src/eda.py
          python src/sql_analysis.py
          Get-ChildItem outputs/sql_results, outputs/figures
          python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('dashboard/app.py', default_timeout=180).run(); assert not app.exception, [e.value for e in app.exception]; print({m.label: m.value for m in app.metric})"

  laptop-mac:
    # The same path as the Lab's Mac lessons give it: Terminal, Python 3.13, a venv, the doctor, the pipeline,
    # the dashboard.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The lessons' commands, in one Terminal session
        env:
          PNP_DOCTOR_CI: "1"
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          git config --global user.name "Lab CI"
          git config --global user.email "lab-ci@users.noreply.github.com"
          python scripts/doctor.py
          bash scripts/run_all.sh
          ls outputs/sql_results outputs/figures
          python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('dashboard/app.py', default_timeout=180).run(); assert not app.exception, [e.value for e in app.exception]; print({m.label: m.value for m in app.metric})"
